services:
  - type: web
    name: resumeflow-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "3306"
      - key: DB_NAME
        value: "resumeflow"
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
